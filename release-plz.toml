[workspace]
changelog_update = false
git_release_enable = false
git_tag_enable = false
publish = false
# `release_always` is left at its default of true. Setting it to false makes
# release-plz tag only from a commit it authored through its own release pull
# request, so a version bumped by hand leaves the crate permanently
# unreleasable: no release pull request is proposed because the version is
# already ahead, and no tag is created because there was no release pull
# request.

[[package]]
name = "terminfokit"
changelog_include = ["terminfokit-cli"]
changelog_path = "./CHANGELOG.md"
changelog_update = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
version_group = "terminfokit"

[[package]]
name = "terminfokit-cli"
version_group = "terminfokit"

[[package]]
name = "terminfokit-conformance"
release = false

[changelog]
header = """<!--
SPDX-FileCopyrightText: 2026 Yasunobu Sakashita

SPDX-License-Identifier: MIT OR Apache-2.0
-->

# Changelog

This file lists notable changes. Versions follow Semantic Versioning.

## Unreleased

"""
tag_pattern = "v[0-9].*"
