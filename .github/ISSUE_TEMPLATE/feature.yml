name: Feature request
description: Propose an API, CLI, compatibility, or tooling change.
title: "feature: "
labels:
  - "type: enhancement"
  - "status: needs-triage"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired behavior.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and alternatives
      description: List relevant compatibility, API, non-goal, and alternative details.
