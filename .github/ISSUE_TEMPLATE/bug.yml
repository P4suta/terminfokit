name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels:
  - "type: bug"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or unpatched vulnerability details. Use private
        vulnerability reporting for security issues.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest source, binary, command, or Rust example that reproduces the issue.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Linux x86_64, Windows 11, macOS, wasm32, no_std target
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant stderr, diagnostics, or a backtrace.
      render: text
