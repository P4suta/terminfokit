name: Bug report
description: Report a reproducible bug.
title: "bug: "
labels:
  - "type: bug"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or undisclosed vulnerabilities. Report security
        issues privately.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducing input or command.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Linux x86_64, Windows 11, macOS, wasm32, no_std target
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant diagnostics or a backtrace.
      render: text
