name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Workflow and documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      oracle: ${{ steps.changes.outputs.oracle }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - name: Validate selection outputs
        env:
          CODE_FILTER: ${{ steps.changes.outputs.code }}
          ORACLE_FILTER: ${{ steps.changes.outputs.oracle }}
          RELEASE_FILTER: ${{ steps.changes.outputs.release }}
        run: >-
          jq -en --arg code "$CODE_FILTER" --arg oracle "$ORACLE_FILTER" --arg release "$RELEASE_FILTER"
          '[$code, $oracle, $release] | all(. == "true" or . == "false")'
      - name: Lint handwritten workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
        with:
          version: "1.7.12"
          pyflakes: false
          files: |
            .github/workflows/ci.yml
            .github/workflows/codeql.yml
            .github/workflows/bsd.yml
            .github/workflows/scorecard.yml
            .github/workflows/dependency-review.yml
            .github/workflows/release-plz.yml
            .github/workflows/release-dry-run.yml
            .github/workflows/release-approval.yml
            .github/workflows/publish-crates.yml
            .github/workflows/sbom.yml
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6.0.0
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b  # v1.51.1
        with:
          config: ./_typos.toml
      - run: cmp README.md crates/terminfokit/README.md

  test:
    needs: [quality]
    if: needs.quality.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: "1.88.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc
      - run: cargo check -p terminfokit --no-default-features
      - run: cargo test -p terminfokit --doc --no-default-features

  lint:
    needs: [quality]
    if: needs.quality.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,thumbv7em-none-eabi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p terminfokit --no-default-features --target wasm32-unknown-unknown
      - run: cargo check -p terminfokit --no-default-features --target thumbv7em-none-eabi
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      - run: cargo package -p terminfokit --allow-dirty --locked
      # Only the library was packaged here before, so nothing checked the CLI --
      # which sets `readme = "../../README.md"`, a path outside its own package
      # root, and publishes second in an order-dependent chain. It cannot be
      # packaged alone until the library is on crates.io, so package the
      # publishable members together and let Cargo resolve the sibling.
      - run: >-
          cargo package --workspace --exclude terminfokit-conformance
          --allow-dirty --locked --no-verify
      # The public library and the primary CLI binary intentionally share the user-facing name `terminfokit`.
      # Generate their documentation into separate target directories because Cargo otherwise races on the same output path.
      - run: >-
          cargo doc -p terminfokit -p terminfokit-conformance
          --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: >-
          cargo doc -p terminfokit-cli --all-features --no-deps --locked
          --target-dir target/cli-doc
        env:
          RUSTDOCFLAGS: -D warnings

  supply-chain:
    name: Supply chain
    needs: [quality]
    if: needs.quality.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --all-features --locked check

  release-workflow:
    name: Release workflow drift
    needs: [quality]
    if: needs.quality.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install dist
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh |
            sh
      # `dist` owns .github/workflows/v-release.yml and regenerates it from
      # [workspace.metadata.dist] in Cargo.toml. Anything that edits the
      # generated file directly -- a Dependabot action bump, most often --
      # desynchronizes the two, and until now the only thing that noticed was
      # `dist plan` inside the release itself. Checking here turns a broken
      # release into a failed pull request.
      - name: Check generated release workflow is current
        run: dist generate --check

  full-oracle:
    needs: [quality]
    if: needs.quality.outputs.oracle == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.99.1"
      # Keyed on the pinned digests, so the cache can only ever hold the exact
      # archive the lock file names. The fetch script verifies it again.
      - name: Cache the ncurses 6.6 archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/oracle/ncurses-6.6.tar.gz
          key: ncurses-oracle-${{ hashFiles('oracle/ncurses-6.6.lock') }}
      - name: Fetch ncurses 6.6
        run: ./scripts/fetch-ncurses-oracle.sh target/oracle
      - name: Compare oracle output
        run: >-
          cargo run --locked -p terminfokit-conformance --
          target/oracle/ncurses-6.6.tar.gz
          target/full-oracle
          "$(date -u +%F)"

  required:
    name: required
    if: always()
    needs:
      - quality
      - test
      - lint
      - supply-chain
      - release-workflow
      - full-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          CODE_SELECTED: ${{ needs.quality.outputs.code }}
          ORACLE_SELECTED: ${{ needs.quality.outputs.oracle }}
          RELEASE_SELECTED: ${{ needs.quality.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg code "$CODE_SELECTED" --arg oracle "$ORACLE_SELECTED" \
            --arg release "$RELEASE_SELECTED" --arg event "$EVENT_NAME" '
            ([$code, $oracle, $release] | all(. == "true" or . == "false")) and
            .quality.result == "success" and
            ([.test.result, .lint.result, ."supply-chain".result] |
              all(. == (if $code == "true" or $event == "workflow_dispatch" then "success" else "skipped" end))) and
            (."full-oracle".result == (if $oracle == "true" or $event == "workflow_dispatch" then "success" else "skipped" end)) and
            (."release-workflow".result == (if $release == "true" or $event == "workflow_dispatch" then "success" else "skipped" end))
            ' <<< "$RESULTS"
