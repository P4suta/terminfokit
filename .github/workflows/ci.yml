name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reuse:
    name: REUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6.0.0

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14  # v1.48.0
        with:
          config: ./_typos.toml

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, "1.88.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc
      - run: cargo check -p terminfokit --no-default-features
      - run: cargo test -p terminfokit --doc --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,thumbv7em-none-eabi
      - run: cargo fmt --all -- --check
      - run: cmp README.md crates/terminfokit/README.md
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p terminfokit --no-default-features --target wasm32-unknown-unknown
      - run: cargo check -p terminfokit --no-default-features --target thumbv7em-none-eabi
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      - run: cargo package -p terminfokit --allow-dirty --locked
      # Only the library was packaged here before, so nothing checked the CLI --
      # which sets `readme = "../../README.md"`, a path outside its own package
      # root, and publishes second in an order-dependent chain. It cannot be
      # packaged alone until the library is on crates.io, so package the
      # publishable members together and let Cargo resolve the sibling.
      - run: >-
          cargo package --workspace --exclude terminfokit-conformance
          --allow-dirty --locked --no-verify
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      # cargo-deny is installed as a tool rather than run through
      # EmbarkStudios/cargo-deny-action, which is not on this repository's
      # Actions allowlist. Keeping the allowlist unchanged is deliberate.
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853  # v2.83.2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --all-features --locked check

  release-workflow:
    name: Release workflow drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install dist
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh |
            sh
      # `dist` owns .github/workflows/v-release.yml and regenerates it from
      # [workspace.metadata.dist] in Cargo.toml. Anything that edits the
      # generated file directly -- a Dependabot action bump, most often --
      # desynchronizes the two, and until now the only thing that noticed was
      # `dist plan` inside the release itself. Checking here turns a broken
      # release into a failed pull request.
      - name: Check generated release workflow is current
        run: dist generate --check

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-15
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz smoke
        shell: bash
        run: |
          set -euo pipefail
          for target in binary_decode source_parse termcap_parse resolver formatter expander entry_roundtrip; do
            cargo fuzz run "$target" "fuzz/corpus/$target" -- \
              -runs=256 -timeout=5 -rss_limit_mb=1024 \
              -dict=fuzz/terminfo.dict
          done

  full-oracle:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88.0"
      # Keyed on the pinned digests, so the cache can only ever hold the exact
      # archive the lock file names. The fetch script verifies it again.
      - name: Cache the ncurses 6.6 archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/oracle/ncurses-6.6.tar.gz
          key: ncurses-oracle-${{ hashFiles('oracle/ncurses-6.6.lock') }}
      - name: Fetch ncurses 6.6
        run: ./scripts/fetch-ncurses-oracle.sh target/oracle
      - name: Compare oracle output
        run: >-
          cargo run --locked -p terminfokit-conformance --
          target/oracle/ncurses-6.6.tar.gz
          target/full-oracle
          "$(date -u +%F)"

  required:
    name: CI required
    if: always()
    needs:
      - reuse
      - spelling
      - test
      - lint
      - supply-chain
      - release-workflow
      - fuzz-smoke
      - full-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          SPELLING_RESULT: ${{ needs.spelling.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          RELEASE_WORKFLOW_RESULT: ${{ needs.release-workflow.result }}
          FUZZ_RESULT: ${{ needs.fuzz-smoke.result }}
          ORACLE_RESULT: ${{ needs.full-oracle.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REUSE_RESULT" = success
          test "$SPELLING_RESULT" = success
          test "$TEST_RESULT" = success
          test "$LINT_RESULT" = success
          test "$SUPPLY_CHAIN_RESULT" = success
          test "$RELEASE_WORKFLOW_RESULT" = success
          test "$FUZZ_RESULT" = success
          if test "$EVENT_NAME" = pull_request; then
            test "$ORACLE_RESULT" = success
          else
            test "$ORACLE_RESULT" = skipped
          fi
