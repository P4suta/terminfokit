name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dist
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh |
            sh

      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - name: Plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          dist plan --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: Build (${{ join(matrix.targets, ', ') }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        if: ${{ matrix.container }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install dist
        run: ${{ matrix.install_dist.run }}

      - name: Fetch plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Install cargo-auditable
        run: ${{ matrix.install_cargo_auditable.run }}

      - name: Install system dependencies
        run: ${{ matrix.packages_install }}

      - name: Build local artifacts
        run: >-
          dist build --print=linkage --output-format=json
          ${{ matrix.dist_args }} > dist-manifest.json

      - name: Collect artifact paths
        id: dist
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest \
              --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload local artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    name: Build installers
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-22.04
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - name: Make dist executable
        run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Build global artifacts
        id: dist
        shell: bash
        run: |
          set -euo pipefail
          dist build --output-format=json \
            --artifacts=global > dist-manifest.json
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  sbom:
    needs: plan
    uses: ./.github/workflows/sbom.yml
    with:
      plan: ${{ needs.plan.outputs.val }}

  collect:
    name: Collect assets
    needs:
      - build-global-artifacts
      - sbom
    runs-on: ubuntu-22.04
    steps:
      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: artifacts-*
          path: artifacts/
          merge-multiple: true

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dry-run
          path: artifacts/
          retention-days: 7
