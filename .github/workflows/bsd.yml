name: BSD checks

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: bsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1
        with:
          usesh: true
          prepare: pkg install -y rust
          run: |
            rustc --version
            tic -V
            cargo test --workspace
            cargo check -p terminfokit --no-default-features

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/netbsd-vm@7f23a491dcc69c34195721ab67934917707f84c7
        with:
          usesh: true
          prepare: /usr/sbin/pkg_add rust ncurses
          run: |
            rustc --version
            command -v tic
            cargo test --workspace
            cargo check -p terminfokit --no-default-features
